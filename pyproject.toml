[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentrygraph"
version = "0.1.0"
description = "Contract-to-execution graph conformance for tool-using AI agents"
requires-python = ">=3.11"
dependencies = [
    "agentdojo==0.1.35"
]

[project.optional-dependencies]
learning = [
    "numpy>=2.5,<3.0",
    "scikit-learn>=1.9,<2.0",
    "torch>=2.15,<3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sentrygraph*"]
